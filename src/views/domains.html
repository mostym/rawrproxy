<!DOCTYPE html>
<html>
<head>
    <title>Domain & Backend Management</title>
    <style>
        .domain-section {
            background: white;
            border-radius: 10px;
            padding: 25px;
            margin: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        .domain-card {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
            background: #f9f9f9;
        }
        
        .domain-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .domain-name {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }
        
        .subdomain-list {
            margin: 10px 0;
            padding-left: 20px;
        }
        
        .subdomain-item {
            padding: 5px 10px;
            background: white;
            border-radius: 4px;
            margin: 5px 0;
            display: flex;
            justify-content: space-between;
        }
        
        .backend-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        
        .backend-card {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            background: white;
        }
        
        .backend-status {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 5px;
        }
        
        .backend-status.healthy {
            background: #10b981;
        }
        
        .backend-status.unhealthy {
            background: #ef4444;
        }
        
        .load-balance-method {
            display: inline-block;
            padding: 3px 8px;
            background: #667eea;
            color: white;
            border-radius: 4px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="domain-section">
        <h2>Domain Management</h2>
        
        <div class="form-group">
            <h3>Add New Domain</h3>
            <input type="text" id="newDomain" placeholder="example.com" style="width: 300px;">
            <button class="btn btn-primary" onclick="addDomain()">Add Domain</button>
        </div>
        
        <div id="domainsList"></div>
    </div>

    <div class="domain-section">
        <h2>Backend Servers</h2>
        
        <div class="form-group">
            <h3>Add New Backend</h3>
            <input type="text" id="backendName" placeholder="Backend Name" style="width: 200px;">
            <input type="text" id="backendUrl" placeholder="http://server:port" style="width: 300px;">
            <input type="number" id="backendWeight" placeholder="Weight (1-10)" value="1" style="width: 100px;">
            <input type="text" id="healthPath" placeholder="/health" value="/health" style="width: 150px;">
            <button class="btn btn-primary" onclick="addBackend()">Add Backend</button>
        </div>
        
        <div id="backendsList" class="backend-list"></div>
    </div>

    <script>
        let domains = [];
        let backends = [];
        let currentDomainId = null;

        async function loadDomains() {
            try {
                const response = await fetch('/api/domains');
                domains = await response.json();
                renderDomains();
            } catch (error) {
                console.error('Failed to load domains:', error);
            }
        }

        async function loadBackends() {
            try {
                const response = await fetch('/api/backends');
                backends = await response.json();
                renderBackends();
            } catch (error) {
                console.error('Failed to load backends:', error);
            }
        }

        function renderDomains() {
            let html = '';
            domains.forEach(domain => {
                html += `
                    <div class="domain-card">
                        <div class="domain-header">
                            <div class="domain-name">${domain.domain}</div>
                            <div>
                                <button class="btn btn-primary" onclick="showSubdomainModal(${domain.id})">Add Subdomain</button>
                                <button class="btn btn-primary" onclick="showAssignBackendModal(${domain.id})">Assign Backend</button>
                                <button class="btn btn-danger" onclick="deleteDomain(${domain.id})">Delete</button>
                            </div>
                        </div>
                        <div id="subdomains-${domain.id}" class="subdomain-list"></div>
                        <div id="domain-backends-${domain.id}"></div>
                    </div>
                `;
            });
            document.getElementById('domainsList').innerHTML = html;
            
            // Load subdomains and backends for each domain
            domains.forEach(domain => {
                loadDomainDetails(domain.id);
            });
        }

        async function loadDomainDetails(domainId) {
            try {
                // Load subdomains
                const subResponse = await fetch(`/api/domains/${domainId}/subdomains`);
                const subdomains = await subResponse.json();
                
                let subHtml = '<h4>Subdomains:</h4>';
                if (subdomains.length === 0) {
                    subHtml += '<p>No subdomains configured</p>';
                } else {
                    subdomains.forEach(sub => {
                        subHtml += `
                            <div class="subdomain-item">
                                <span>${sub.subdomain}.${domains.find(d => d.id === domainId).domain}</span>
                                ${sub.path_prefix ? `<span>Path: ${sub.path_prefix}</span>` : ''}
                            </div>
                        `;
                    });
                }
                document.getElementById(`subdomains-${domainId}`).innerHTML = subHtml;
                
                // Load assigned backends
                const backResponse = await fetch(`/api/domains/${domainId}/backends`);
                const domainBackends = await backResponse.json();
                
                let backHtml = '<h4>Assigned Backends:</h4>';
                if (domainBackends.length === 0) {
                    backHtml += '<p>No backends assigned</p>';
                } else {
                    backHtml += '<div style="display: flex; gap: 10px; flex-wrap: wrap;">';
                    domainBackends.forEach(backend => {
                        backHtml += `
                            <div style="padding: 5px 10px; background: #f0f0f0; border-radius: 4px;">
                                <span class="backend-status ${backend.healthy ? 'healthy' : 'unhealthy'}"></span>
                                ${backend.name || backend.url}
                                <span class="load-balance-method">${backend.load_balance_method}</span>
                            </div>
                        `;
                    });
                    backHtml += '</div>';
                }
                document.getElementById(`domain-backends-${domainId}`).innerHTML = backHtml;
                
            } catch (error) {
                console.error('Failed to load domain details:', error);
            }
        }

        function renderBackends() {
            let html = '';
            backends.forEach(backend => {
                html += `
                    <div class="backend-card">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <div>
                                <h4>${backend.name}</h4>
                                <p style="color: #666; font-size: 14px;">${backend.url}</p>
                            </div>
                            <span class="backend-status ${backend.healthy ? 'healthy' : 'unhealthy'}"></span>
                        </div>
                        <div style="margin-top: 10px; font-size: 12px; color: #999;">
                            Weight: ${backend.weight} | Health Check: ${backend.health_check_path}
                            ${backend.response_time ? ` | Response: ${backend.response_time}ms` : ''}
                        </div>
                        <div style="margin-top: 10px;">
                            <button class="btn btn-danger" onclick="deleteBackend(${backend.id})">Delete</button>
                        </div>
                    </div>
                `;
            });
            document.getElementById('backendsList').innerHTML = html;
        }

        async function addDomain() {
            const domain = document.getElementById('newDomain').value;
            if (!domain) {
                alert('Please enter a domain');
                return;
            }

            try {
                const response = await fetch('/api/domains', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ domain, type: 'reverse' })
                });
                
                if (response.ok) {
                    document.getElementById('newDomain').value = '';
                    loadDomains();
                } else {
                    const error = await response.json();
                    alert('Failed to add domain: ' + error.error);
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        async function addBackend() {
            const name = document.getElementById('backendName').value;
            const url = document.getElementById('backendUrl').value;
            const weight = document.getElementById('backendWeight').value;
            const healthCheckPath = document.getElementById('healthPath').value;

            if (!name || !url) {
                alert('Please enter backend name and URL');
                return;
            }

            try {
                const response = await fetch('/api/backends', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, url, weight: parseInt(weight), healthCheckPath })
                });
                
                if (response.ok) {
                    document.getElementById('backendName').value = '';
                    document.getElementById('backendUrl').value = '';
                    document.getElementById('backendWeight').value = '1';
                    loadBackends();
                } else {
                    alert('Failed to add backend');
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        async function deleteDomain(id) {
            if (!confirm('Are you sure you want to delete this domain?')) return;
            
            try {
                const response = await fetch(`/api/domains/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    loadDomains();
                }
            } catch (error) {
                alert('Failed to delete domain');
            }
        }

        async function deleteBackend(id) {
            if (!confirm('Are you sure you want to delete this backend?')) return;
            
            try {
                const response = await fetch(`/api/backends/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    loadBackends();
                }
            } catch (error) {
                alert('Failed to delete backend');
            }
        }

        function showSubdomainModal(domainId) {
            const subdomain = prompt('Enter subdomain (e.g., "api" for api.example.com):');
            if (!subdomain) return;
            
            const pathPrefix = prompt('Enter path prefix (optional, e.g., "/v1"):') || null;
            const stripPath = confirm('Strip path prefix from backend requests?');
            
            addSubdomain(domainId, subdomain, pathPrefix, stripPath);
        }

        async function addSubdomain(domainId, subdomain, pathPrefix, stripPath) {
            try {
                const response = await fetch(`/api/domains/${domainId}/subdomains`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ subdomain, pathPrefix, stripPath })
                });
                
                if (response.ok) {
                    loadDomainDetails(domainId);
                }
            } catch (error) {
                alert('Failed to add subdomain');
            }
        }

        function showAssignBackendModal(domainId) {
            if (backends.length === 0) {
                alert('Please add backend servers first');
                return;
            }
            
            let backendOptions = backends.map(b => `${b.id}: ${b.name} (${b.url})`).join('\n');
            const backendId = prompt(`Select backend ID:\n${backendOptions}`);
            if (!backendId) return;
            
            const methods = ['round_robin', 'weighted', 'least_connections', 'ip_hash', 'sticky'];
            const method = prompt(`Select load balance method:\n${methods.join(', ')}`) || 'round_robin';
            
            assignBackend(domainId, parseInt(backendId), method);
        }

        async function assignBackend(domainId, backendId, loadBalanceMethod) {
            try {
                const response = await fetch(`/api/domains/${domainId}/backends`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ backendId, loadBalanceMethod })
                });
                
                if (response.ok) {
                    loadDomainDetails(domainId);
                }
            } catch (error) {
                alert('Failed to assign backend');
            }
        }

        // Initial load
        loadDomains();
        loadBackends();
        
        // Auto-refresh every 10 seconds
        setInterval(() => {
            loadDomains();
            loadBackends();
        }, 10000);
    </script>
</body>
</html>
